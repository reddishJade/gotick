   services:
     mysql:
       image: mysql:8.4
       environment:
         MYSQL_ROOT_PASSWORD: root
         MYSQL_DATABASE: gotick
       ports:
         - "3306:3306"
       volumes:
         - mysql-data:/var/lib/mysql

     redis:
       image: redis:7.4
       ports:
         - "6379:6379"
       volumes:
         - redis-data:/data

   volumes:
     mysql-data:
     redis-data: